---
- name: Install or update ingress-nginx controller
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('kubernetes.core.kustomize', dir=role_path ~ '/templates/k8s/ingress') }}"
  when: install_ingress

- name: Wait for ingress-nginx controller
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: ingress-nginx
    name: ingress-nginx-controller
  register: ingress_nginx_ready
  until: >-
    ingress_nginx_ready.resources | length > 0 and
    (ingress_nginx_ready.resources[0].status.readyReplicas | default(0)) > 0
  retries: "{{ (wait_timeout | default(60) | int) // 10 }}"
  delay: 10
  when: install_ingress

- name: Get ingress-nginx controller cluster IP
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: ingress-nginx
    name: ingress-nginx-controller
  register: ingress_nginx_service
  when:
    - install_ingress
    - ingress_domain is defined
    - ingress_domain | length > 0

- name: Configure CoreDNS for ingress domain
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'templates/k8s/coredns/coredns.yaml.j2') }}"
  vars:
    clusterip: "{{ ingress_nginx_service.resources[0].spec.clusterIP }}"
  when:
    - install_ingress
    - ingress_domain is defined
    - ingress_domain | length > 0
    - ingress_nginx_service.resources | length > 0

- name: Restart CoreDNS
  command: kubectl -n kube-system rollout restart deployment/coredns
  changed_when: true
  when:
    - install_ingress
    - ingress_domain is defined
    - ingress_domain | length > 0
    - ingress_nginx_service.resources | length > 0

- name: Creating CRDs
  kubernetes.core.k8s:
    definition: "{{ lookup('kubernetes.core.kustomize', dir='https://github.com/hyperledger-labs/fabric-operator.git/config/crd') }}"
  register: resultcrds

- name: Fail if namespace not specified
  fail:
    msg: namespace not specified or is empty
  when: not namespace is defined or not namespace

- name: Determine if namespace exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ namespace }}"
  register: namespace_info

- name: Create namespace
  kubernetes.core.k8s:
    state: present
    definition:
      api_version: v1
      kind: Namespace
      metadata:
        name: "{{ namespace }}"
        labels:
          'pod-security.kubernetes.io/enforce': baseline
  when: not namespace_info.resources

- name: Create Role Based Access Control
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace }}"
    resource_definition: "{{ lookup('template', 'templates/' + target + '/rbac/' + item) }}"
    apply: yes
  loop:
    - hlf-operator-clusterrole.yaml
    - hlf-operator-clusterrolebinding.yaml.j2
    - hlf-operator-serviceaccount.yaml

- name: Create Operator
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace }}"
    resource_definition: "{{ lookup('template', 'templates/' + target + '/manager/' + item) }}"
    apply: yes
  loop:
    - hlf-operator-manager.yaml.j2

- name: Wait for operator
  shell: |
    kubectl -n {{ namespace }} rollout status deploy fabric-operator
  changed_when: false
